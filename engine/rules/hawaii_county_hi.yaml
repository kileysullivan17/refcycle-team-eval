# RefCycle rules pack: County of Hawaiʻi, HI
# Format: see _FORMAT.md in this folder.
# DRAFT 2026-09-10. Quotes were captured by a web-reading tool, not copied by hand. Every rule is
# verified_by_ks: false until checked against the live page.

jurisdiction:
  id: hawaii_county_hi
  name: "County of Hawaiʻi, HI"
  system_summary: >-
    No curbside rubbish or recycling pickup. Residents take materials to County Recycling and
    Transfer Stations. Drop-off recycling bins take only corrugated cardboard, brown kraft paper bags,
    and small glass containers. HI-5 deposit beverage containers are redeemed separately at
    redemption centers. Greenwaste goes to Greenwaste Recycling Collection Sites.
    PLASTICS ARE WHERE THE PUBLISHED RULES AND REALITY DIVERGE. A County page still online says #1 and
    #2 plastics are accepted; the current drop-off page says no plastics of any kind; transfer stations
    have no plastics bins and staff say plastics are not accepted. The only plastics with a clear,
    published rule are HI-5 beverage containers. Two private sites take some plastics, neither
    publishes it, and each takes less than a resident would expect.
  official_contact_url: "https://www.hawaiizerowaste.org/recycle/drop-off/"

