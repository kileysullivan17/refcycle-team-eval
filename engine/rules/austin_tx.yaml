    verified_by_ks: true

  - id: atx-plastic-006
    applies_to: ["plastic buckets and baskets", "lawn chairs", "outdoor furniture", "coat hangers", "non-battery plastic toys"]
    stream: recycle_bin
    conditions: null
    prep: []
    where: null
    source: src-02
    quote: "Coat hangers ... Outdoor furniture ... Non-battery plastic toy"
    verified_by_ks: true

  - id: atx-plastic-007
    applies_to: ["straws", "loose bottle caps", "plastic items smaller than 3 inches", "plasticware"]
