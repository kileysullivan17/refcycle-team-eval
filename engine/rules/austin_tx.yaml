  - id: atx-compost-013
    applies_to: ["food scraps", "meat, poultry and seafood (including bones)", "cheese", "dairy products", "fruits", "vegetables", "grains", "pasta", "eggshells", "bread", "coffee grounds", "tea bags", "baked goods", "nuts", "leftovers", "spoiled food"]
    stream: compost_bin
    conditions: null
    prep: ["no liquids, fats, oils or grease"]
    where: null
    source: src-03
    quote: "Cooked or raw meat, poultry and seafood (including bones), cheese, dairy products, fruits, vegetables, grains, pasta, eggshells, bread, coffee grounds, tea bags, tea leaves, baked goods, nuts, jelly, candy, snack foods, leftovers, spoiled food."
    verified_by_ks: true

  - id: atx-compost-014
    applies_to: ["food-soiled paper", "paper bags", "paper napkins", "paper towels", "paper plates", "paper cups", "paper take-out containers (no plastic or wax coating, metal removed)", "pizza boxes", "coffee filters", "tissues"]
    stream: compost_bin
    conditions: null
    prep: ["remove metal", "no plastic or wax coating"]
    where: null
    source: src-03
    quote: "Paper bags, paper napkins, paper towels, paper plates, paper cups, paper take-out containers and take-out boxes (with no plastic or wax coating, and with metal removed), pizza boxes, coffee filters, newspaper, tissues."
    verified_by_ks: true

  - id: atx-compost-015
    applies_to: ["yard trimmings", "grass clippings", "small branches", "small tree limbs", "tree roots", "flowers", "leaves", "plants", "straw"]
    stream: compost_bin
    conditions: null
    prep: []
    where: null
    source: src-03
    quote: "Grass clippings, small branches, small tree limbs, tree roots, flowers, leaves, plants, straw."
    verified_by_ks: true

  - id: atx-compost-016
    applies_to: ["popsicle sticks", "sawdust (in paper bags)", "shredded paper", "toothpicks", "wooden chopsticks", "untreated wood"]
    stream: compost_bin
    conditions: null
    prep: ["sawdust in paper bags"]
    where: null
    source: src-03
    quote: "Popsicle sticks, sawdust (in paper bags), shredded paper, toothpicks, wooden chopsticks and untreated wood."
    verified_by_ks: true

  - id: atx-special-017
    applies_to: ["batteries"]
    stream: drop_off_special
    conditions: null
    prep: []
    where: "Recycle and Reuse Drop-off Center, on-demand household hazardous waste collection, an Austin Public Library branch, or a year-round battery recycling location"
    source: src-04
    quote: "Batteries should never be thrown into dumpsters or curbside trash, recycling or composting carts."
    verified_by_ks: true

  - id: atx-special-018
    applies_to: ["electronics"]
    stream: drop_off_special
    conditions: null
    prep: []
    where: "Schedule an on-demand bulk collection through the Austin Recycles app, online, or by calling 3-1-1"
    source: src-04
    quote: "For electronics, schedule an on-demand bulk collection. ... Both services can be scheduled through the Austin Recycles app, online or by calling 3-1-1 (512-974-2000)."
    verified_by_ks: true

  - id: atx-metal-020
    applies_to: ["aluminum cans", "beverage cans", "soda cans", "beer cans"]
    stream: recycle_bin
    conditions: null
    # Main source names "metal" in general; its Metals list does not name aluminum cans (KS accepted 2026-10-31).
    # Also corroborated by src-06 and src-07 ("Aluminum Cans ... call for pricing").
    also_acceptable: [drop_off_special]
    also_acceptable_source: src-05
    also_acceptable_quote: "Right here in the Austin area you may exchange your empty aluminum cans for money."
    prep: []
    where: "Scrap metal yards in the Austin area buy aluminum cans (private businesses; named in the private pack only)"
    source: src-01
    quote: "Place mixed paper, hard plastic (no bags), metal and glass directly in your blue recycling cart; no sorting is required!"
    verified_by_ks: true

  - id: atx-plastic-021
    applies_to: ["empty prescription pill bottles", "empty drug containers", "empty medicine bottles"]
    stream: recycle_bin
    conditions: null
    prep: ["empty", "conceal or remove personal information, including Rx number"]
    where: null
    source: src-08
    quote: "Conceal or remove any personal information, including Rx number, on the empty containers. ... Place empty drug containers in the blue recycling cart"
    verified_by_ks: true

  - id: atx-special-022
    applies_to: ["used motor oil", "antifreeze", "automotive fluids", "oil filters"]
    stream: drop_off_special
    conditions: null
    prep: []
    where: "Recycle and Reuse Center, by appointment. Free for Austin and Travis County residents; businesses are not eligible to drop off hazardous waste."
    source: src-09
    quote: "The Recycle and Reuse Center requires an appointment. ... Accepted household hazardous waste items ... Automotive fluids and oil filters ... Use of the facility is free for Austin and Travis County residents, except for tires."
    verified_by_ks: true

  - id: atx-special-023
    applies_to: ["tires", "car tires"]
    stream: drop_off_special
    conditions: null
    prep: []
    where: "Recycle and Reuse Center, by appointment. $6 per tire."
    source: src-09
    quote: "The Recycle and Reuse Center requires an appointment. ... Tires ... There is a fee to drop off tires. The fee is $6 per tire."
    verified_by_ks: true

  - id: atx-garbage-024
    applies_to: ["oil-stained cardboard", "paper or cardboard soiled with oil or grease that is not food"]
    stream: garbage
    conditions: null
    prep: []
    where: null
    # Compost keeps oils out; recycling is for clean paper. Not an automotive fluid itself (KS 2026-10-31).
    source: src-03
    quote: "Liquids (including fats, oils, grease) ... Always place clean paper products in your recycling cart so they can be recycled into new paper products"
    destination_inferred: true
    verified_by_ks: true
