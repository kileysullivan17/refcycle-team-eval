# verified_by_ks: false until checked against the live page.

jurisdiction:
  id: austin_tx
  name: "Austin, TX"
  system_summary: >-
    Curbside collection with a blue recycling cart, a green composting cart, and a trash cart.
    Hard-to-recycle items (plastic bags and film, Styrofoam, batteries) go to store drop-off or the
    Recycle and Reuse Drop-off Center, by appointment. Electronics go through on-demand bulk collection.
  official_contact_url: "https://www.austintexas.gov/recycling"

