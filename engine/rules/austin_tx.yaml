    source: src-02
    quote: "Battery-operated toys (Recycle and Reuse Center only"
    verified_by_ks: true

  - id: atx-metal-011
    applies_to: ["aluminum foil (balled 2 inches or larger)", "aluminum foil baking pans", "steel and tin cans"]
    stream: recycle_bin
    conditions: null
    prep: ["ball foil to 2 inches or larger"]
    where: null
    source: src-01
    quote: "Aluminum foil (balled 2 inches or larger) ... Aluminum foil baking pans ... Steel and tin cans"
