    quote: "Bottles (water, soda, juice, hand sanitizer, shampoo, detergent) ... Jugs (milk, water, laundry detergent, bleach) ... Attached bottle caps ... Please rinse food containers, bottles, and jugs to avoid contamination."
    verified_by_ks: true

  - id: atx-plastic-005
    applies_to: ["plastic cups", "tubs (yogurt, sour cream)", "plastic food containers", "plastic jars (peanut butter, mayo)"]
    stream: recycle_bin
    conditions: null
    prep: ["rinse"]
    where: null
    source: src-02
