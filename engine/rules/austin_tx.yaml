rules:
  - id: atx-paper-001
    applies_to: ["catalogs and magazines", "glossy paper", "junk mail and envelopes", "non-foil wrapping paper", "boxes", "toilet paper and paper towel rolls"]
    stream: recycle_bin
    conditions: null
    prep: []
    where: null
    source: src-01
    quote: "Catalogs and magazines ... Glossy paper ... Junk mail and envelopes ... Newspapers ... Non-foil wrapping paper ... Boxes ... Toilet paper and paper towel rolls"
    verified_by_ks: true

  - id: atx-paper-019
    applies_to: ["newspapers"]
    stream: recycle_bin
    conditions: null
    also_acceptable: [compost_bin]
    prep: []
    where: null
    source: src-01
    quote: "Newspapers"
    verified_by_ks: true

  - id: atx-paper-002
    applies_to: ["coated paper products (cups, plates and takeout food containers)", "food and beverage cartons (aseptic and gable top)"]
    stream: recycle_bin
    conditions: null
    prep: []
    where: null
    source: src-01
    quote: "Coated paper products (cups, plates and takeout food containers) ... Food and beverage cartons (aseptic and gable top)"
    verified_by_ks: true

  - id: atx-paper-003
    applies_to: ["cardboard boxes"]
    stream: recycle_bin
    conditions: null
