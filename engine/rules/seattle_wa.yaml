jurisdiction:
  id: seattle_wa
  name: "Seattle, WA"
  system_summary: >-
    Curbside collection in three streams: recycling, compost (food and yard waste), and garbage.
    Recyclables must be empty, clean and dry. Food is not allowed in the garbage or recycling.
    Batteries, electronics and hazardous items need special disposal.
  official_contact_url: "https://www.seattle.gov/utilities/your-services/collection-and-disposal/where-does-it-go"

